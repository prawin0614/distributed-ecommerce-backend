server:
  port: 8082

spring:
  application:
    name: inventory-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: inventory-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      retries: 3
      acks: all
    listener:
      ack-mode: record
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
      specific.avro.reader: true
  datasource:
    url: jdbc:postgresql://localhost:5432/inventorydb
    username: postgres
    password: team6
    port: 5432
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

app:
  kafka:
    topics:
      order-created: order-created
      inventory-reserved: inventory-reserved
      payment-failed: payment-failed
      inventory-reservation-failed: inventory-reservation-failed
      inventory-released: inventory-released
    consumer-groups:
      inventory: inventory-group

resilience4j:
  retry:
    instances:
      inventoryOps:
        max-attempts: 3
        wait-duration: 500ms
  circuitbreaker:
    instances:
      inventoryOps:
        sliding-window-size: 10
        failure-rate-threshold: 50
  ratelimiter:
    instances:
      inventoryOps:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0
